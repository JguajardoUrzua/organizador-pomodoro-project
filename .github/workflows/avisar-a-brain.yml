# Cuando algo se mezcla en main, avisa a Brain (mi-notion-project) para que
# copie esta versión de Focus y abra un pull request allá.
#
# Necesita el secreto BRAIN_DISPATCH_TOKEN: un token de GitHub con permiso
# "Contents: Read and write" sobre mi-notion-project. Sin el secreto, este
# aviso se salta y Brain igual revisa una vez al día.
name: Avisar a Brain

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  avisar:
    runs-on: ubuntu-latest
    steps:
      - name: Enviar aviso a mi-notion-project
        env:
          TOKEN: ${{ secrets.BRAIN_DISPATCH_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::warning::Falta el secreto BRAIN_DISPATCH_TOKEN; Brain se sincronizará en su revisión diaria."
            exit 0
          fi
          curl -fsS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/JguajardoUrzua/mi-notion-project/dispatches \
            -d '{"event_type":"focus-actualizado","client_payload":{"sha":"${{ github.sha }}"}}'
          echo "Aviso enviado a Brain."
